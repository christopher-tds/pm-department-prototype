  <style>
    /* Review page for picking category carousel covers. Not part of the design. Cards reuse the
       carousel card look (4:5, bottom scrim, name and arrow bottom left). */
    :root { --ink: #000; --white: #fff; --card: #f3f3f3; --text-2: #404041; --border: #bbbdc0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--white); color: var(--ink); font: 14px/20px "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; background: var(--white); border-bottom: 1px solid var(--card); }
    h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 500; }
    header p { margin: 4px 0 0; color: var(--text-2); }
    .actions { display: flex; gap: 8px; flex: none; }
    .btn { min-height: 40px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 999px; background: var(--white); font: inherit; font-weight: 500; cursor: pointer; }
    .btn--ink { background: var(--ink); color: var(--white); }
    main { padding: 8px 24px 64px; }
    .row { padding: 32px 0; border-bottom: 1px solid var(--card); }
    .row h2 { margin: 0 0 16px; font-size: 20px; line-height: 28px; font-weight: 500; }
    .row h2 span { color: var(--text-2); font-weight: 400; font-size: 14px; margin-left: 8px; }
    .opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .opt { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .cat { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--card); color: var(--white); outline: 3px solid transparent; outline-offset: 3px; transition: outline-color 150ms ease; }
    .cat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.48), rgba(0,0,0,0) 33%); }
    .cat__name { position: absolute; left: 16px; bottom: 16px; z-index: 1; display: flex; align-items: center; gap: 4px; font-size: 16px; line-height: 24px; font-weight: 500; }
    .opt:hover .cat { outline-color: var(--border); }
    .opt[aria-pressed="true"] .cat { outline-color: var(--ink); }
    .meta { display: flex; justify-content: space-between; gap: 8px; }
    .meta b { font-weight: 500; }
    .meta .check { display: none; font-weight: 500; }
    .opt[aria-pressed="true"] .check { display: inline; }
    .note { margin: 0; color: var(--text-2); }
    @media (max-width: 749px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { flex-direction: column; align-items: flex-start; } main, header { padding-left: 12px; padding-right: 12px; } }
  </style>
</head>
<body>

      <p>Pick one per category; your picks save in this browser. Copy picks to send them back.</p>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="reset">Reset</button>
      <button class="btn btn--ink" type="button" id="copy">Copy picks</button>
    </div>
  </header>

];
    const KEY = "pm-dept-cover-picks";
    const ARROW = '<svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>';
    let picks = {};
    try { picks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { /* storage blocked */ }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) { /* storage blocked */ } };

    function render() {
      document.getElementById("rows").innerHTML = ROWS.map((r) => {
        const opts = [{ label: "Current", src: r.current, note: "What the carousel uses now" },
          ...r.options.map((o, i) => ({ label: "Option " + "ABC"[i], src: o.src, note: o.note, product: o.product }))];
        const chosen = picks[r.key] || "Current";
        return `<section class="row" aria-labelledby="h-${r.key}">
          <h2 id="h-${r.key}">${r.title}<span>Picked: ${chosen}</span></h2>
          <div class="opts" role="group" aria-label="${r.title} cover options">
            ${opts.map((o) => `<button type="button" class="opt" data-key="${r.key}" data-label="${o.label}" aria-pressed="${o.label === chosen}">
              <span class="cat"><img src="${o.src}?width=720" srcset="${o.src}?width=480 480w, ${o.src}?width=720 720w, ${o.src}?width=1000 1000w"
                sizes="(min-width: 750px) 24vw, 46vw" alt="" loading="lazy" decoding="async">
                <span class="cat__name">${r.title}${ARROW}</span></span>
              <span class="meta"><b>${o.label}</b><span class="check">Picked</span></span>
              <p class="note">${o.note}${o.product ? ` · ${o.product}` : ""}</p>
            </button>`).join("")}
          </div>
        </section>`;
      }).join("");
    }

    document.getElementById("rows").addEventListener("click", (e) => {
      const b = e.target.closest(".opt");
      if (!b) return;
      picks[b.dataset.key] = b.dataset.label;
      save();
      const y = scrollY;
      render();
      scrollTo(0, y);
    });
    document.getElementById("reset").addEventListener("click", () => { picks = {}; save(); render(); });
    document.getElementById("copy").addEventListener("click", (e) => {
      const text = ROWS.map((r) => `${r.title}: ${picks[r.key] || "Current"}`).join("\n");
      navigator.clipboard?.writeText(text).then(() => {
        e.target.textContent = "Copied";
        setTimeout(() => { e.target.textContent = "Copy picks"; }, 1200);
      });
    });
    render();
  </script>
